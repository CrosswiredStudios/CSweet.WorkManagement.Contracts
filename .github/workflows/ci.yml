name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore CSweet.WorkManagement.Contracts.slnx
      - run: dotnet build CSweet.WorkManagement.Contracts.slnx --configuration Release --no-restore
      - run: dotnet test CSweet.WorkManagement.Contracts.slnx --configuration Release --no-build --no-restore
      - run: dotnet pack src/CSweet.WorkManagement.Contracts/CSweet.WorkManagement.Contracts.csproj --configuration Release --no-build --no-restore --output artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.*nupkg
